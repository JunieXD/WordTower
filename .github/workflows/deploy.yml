name: Deploy to 1Panel VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -euo pipefail

            BACKEND_PATH="/opt/1panel/www/sites/wt/WordTower-backend-python"
            BACKEND_CONTAINER_NAME="wt"

            echo "[deploy] start backend deploy"
            cd "$BACKEND_PATH"
            git pull origin main

            # Keep requirements.txt updated if uv exists on host.
            if command -v uv >/dev/null 2>&1 && [ -f "pyproject.toml" ]; then
              uv export --format requirements-txt --no-hashes > requirements.txt
            fi

            CONTAINER_ID="$(docker ps -q --filter "name=${BACKEND_CONTAINER_NAME}" | head -n 1)"
            if [ -z "$CONTAINER_ID" ]; then
              echo "[deploy] no running backend container found: ${BACKEND_CONTAINER_NAME}"
              exit 1
            fi

            MIGRATED=0

            echo "[deploy] try migrate in container"
            if docker exec "$CONTAINER_ID" sh -lc '
              set -e

              ALEMBIC_INI_PATH=""
              for base in /opt /app /srv /workspace /usr/src /code /; do
                if [ -d "$base" ]; then
                  found="$(find "$base" -type f -name "alembic.ini" 2>/dev/null | head -n 1 || true)"
                  if [ -n "$found" ]; then
                    ALEMBIC_INI_PATH="$found"
                    break
                  fi
                fi
              done

              if [ -z "$ALEMBIC_INI_PATH" ]; then
                echo "[migrate] alembic.ini not found in container"
                exit 1
              fi

              ALEMBIC_DIR="$(dirname "$ALEMBIC_INI_PATH")"
              cd "$ALEMBIC_DIR"
              echo "[migrate] using $ALEMBIC_INI_PATH"

              if command -v uv >/dev/null 2>&1; then
                uv run alembic upgrade head
              elif command -v alembic >/dev/null 2>&1; then
                alembic upgrade head
              elif command -v python >/dev/null 2>&1; then
                python -m alembic upgrade head
              else
                echo "[migrate] no uv/alembic/python in container"
                exit 1
              fi
            '; then
              MIGRATED=1
            else
              echo "[deploy] container migration failed, fallback to host"
            fi

            if [ "$MIGRATED" -ne 1 ]; then
              if command -v uv >/dev/null 2>&1 && [ -f "$BACKEND_PATH/app/alembic.ini" ]; then
                (
                  cd "$BACKEND_PATH/app"
                  uv run alembic upgrade head
                )
                MIGRATED=1
                echo "[deploy] host migration completed"
              fi
            fi

            if [ "$MIGRATED" -ne 1 ]; then
              echo "[deploy] migration failed in both container and host"
              exit 1
            fi

            echo "[deploy] restart backend container"
            docker restart "$CONTAINER_ID"
            echo "[deploy] backend deploy completed"
