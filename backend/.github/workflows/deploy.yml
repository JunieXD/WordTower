name: Deploy to 1Panel VPS

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ".python-version"

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Export requirements
        run: bash scripts/export_requirements.sh

      - name: Update backend code on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -euo pipefail

            BACKEND_PATH="/opt/1panel/www/sites/wt/WordTower-backend-python"

            echo "[deploy] update backend code"
            cd "$BACKEND_PATH"
            git pull origin main

      - name: Upload exported requirements
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          source: "requirements.txt"
          target: "/opt/1panel/www/sites/wt/WordTower-backend-python/"

      - name: Verify exported requirements on server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -euo pipefail

            BACKEND_PATH="/opt/1panel/www/sites/wt/WordTower-backend-python"

            if [ ! -f "$BACKEND_PATH/requirements.txt" ]; then
              echo "[deploy] requirements.txt missing on server"
              ls -la "$BACKEND_PATH" || true
              exit 1
            fi

            echo "[deploy] requirements.txt uploaded"
            head -n 2 "$BACKEND_PATH/requirements.txt"

      - name: Start or restart backend container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          password: ${{ secrets.PASSWORD }}
          script: |
            set -euo pipefail

            BACKEND_PATH="/opt/1panel/www/sites/wt/WordTower-backend-python"
            BACKEND_CONTAINER_NAME="wt"

            find_compose_file() {
              for base in "$BACKEND_PATH" "$(dirname "$BACKEND_PATH")"; do
                [ -d "$base" ] || continue
                found="$(
                  find "$base" -maxdepth 3 -type f \
                    \( -name "docker-compose.yml" -o -name "docker-compose.yaml" -o -name "compose.yml" -o -name "compose.yaml" \) \
                    2>/dev/null | head -n 1 || true
                )"
                if [ -n "$found" ]; then
                  echo "$found"
                  return 0
                fi
              done
              return 1
            }

            RUNNING_CONTAINER_ID="$(docker ps -q --filter "name=^/${BACKEND_CONTAINER_NAME}$" | head -n 1)"
            STOPPED_CONTAINER_ID="$(docker ps -aq --filter "name=^/${BACKEND_CONTAINER_NAME}$" | head -n 1)"
            CONTAINER_ID=""

            if [ -n "$RUNNING_CONTAINER_ID" ]; then
              CONTAINER_ID="$RUNNING_CONTAINER_ID"
              echo "[deploy] restart backend container"
              docker restart "$CONTAINER_ID" >/dev/null
            elif [ -n "$STOPPED_CONTAINER_ID" ]; then
              CONTAINER_ID="$STOPPED_CONTAINER_ID"
              echo "[deploy] start existing backend container"
              docker start "$CONTAINER_ID" >/dev/null
            else
              COMPOSE_FILE="$(find_compose_file || true)"
              if [ -n "$COMPOSE_FILE" ] && docker compose version >/dev/null 2>&1; then
                echo "[deploy] backend container not found, try docker compose up via $COMPOSE_FILE"
                (
                  cd "$(dirname "$COMPOSE_FILE")"
                  docker compose -f "$COMPOSE_FILE" up -d
                )
                CONTAINER_ID="$(
                  cd "$(dirname "$COMPOSE_FILE")"
                  docker compose -f "$COMPOSE_FILE" ps -q | head -n 1
                )"
              fi
            fi

            if [ -z "$CONTAINER_ID" ]; then
              echo "[deploy] backend container not found: ${BACKEND_CONTAINER_NAME}"
              docker ps -a --format "table {{.ID}}\t{{.Names}}\t{{.Status}}" || true
              exit 1
            fi

            sleep 8
            if [ "$(docker inspect -f "{{.State.Running}}" "$CONTAINER_ID" 2>/dev/null || echo false)" != "true" ]; then
              echo "[deploy] backend container is not running after deploy"
              docker logs --tail 120 "$CONTAINER_ID" || true
              exit 1
            fi

            echo "[deploy] backend deploy completed"
